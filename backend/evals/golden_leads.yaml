        ready (FD maturing plus HDFC loan sanctioned). Only issue: you quoted 1.32 Cr all-inclusive. If you can come
        to 1.22 with car parking included, I can pay the token this Friday. Please confirm with your manager.
    expected_output: hot
    metadata: {why: Already visited, funds ready, offers a token this week; the price gap is a negotiation, not a blocker.}

