# golden_leads.yaml - 32 realistic leads, each hand-labelled with the tier a salesperson should give it.
#
# Labels were written from the tier definitions below BEFORE running the AI on these leads, and are never edited to
# match the AI's output. A miss is a finding to investigate, not a label to change.
#
#   hot  - a real buyer who can buy within about 3 months, money sorted or clearly arrangeable, asking to act now
#          (site visit, price sheet, booking, token).
#   warm - a real buyer, but 3-6 months out or with a big open question (loan unclear, family must agree, a main
#          objection, still comparing).
#   cold - browsing, 6+ months away, too vague to act on, a budget that can't buy what they ask, or a real person
#          with the wrong intent (wants to rent or sell): needs nurturing or re-routing, not a call today.
#   junk - not a buyer at all: spam, vendor pitches, brokers asking for commission, job seekers, wrong numbers,
#          gibberish.
#
# Used by run_golden.py. All names, numbers and phone details are fictional.

cases:
  # ---------------------------------------------------------------- HOT (8)
  - name: rohit-whitefield-rent-ending
    inputs:
      name: Rohit Verma
      location: Whitefield, Bengaluru
      requirement: 2BHK, east-facing, ready to move
      budget: ₹80-90 lakh
      timeline: Within 1 month
      message: >-
        Hi, mera rent agreement 31 March ko khatam ho raha hai so jaldi shift karna hai. SBI se 70L loan
        pre-approved hai. Whitefield mein 2BHK east facing chahiye, ready to move. Kya is Saturday site visit ho
        sakta hai? Wife bhi aayegi. Price sheet WhatsApp kar do pls.
    expected_output: hot
    metadata: {why: Hard deadline, loan pre-approved, asks for a visit and price sheet, decision-maker coming.}

  - name: priya-relocating-school-deadline
    inputs:
      name: Priya Nair
      location: Sarjapur Road, Bengaluru
      requirement: 3BHK, 1500+ sq ft, good school nearby
      budget: ₹1.4-1.6 Cr
      timeline: 1-3 months
      message: >-
        We're relocating from Chennai, my husband joins a company on Sarjapur Road on 15 Jan. Need a 3BHK ready or
