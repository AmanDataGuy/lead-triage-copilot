        our Chennai flat, the rest a home loan. Can you share availability on higher floors and the all-inclusive
        cost? We can visit next weekend.
    expected_output: hot
    metadata: {why: Dated deadline, funding planned, asks availability and cost, visit next weekend.}

  - name: lakshmi-token-ready-price-gap
    inputs:
      name: Lakshmi Subramanian
      location: Devanahalli, near Bengaluru airport
